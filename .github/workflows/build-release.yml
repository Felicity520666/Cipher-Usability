name: Build Cipher Usability Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v1.0.0

  release:
    types: [published]

permissions:
  contents: write

env:
  APP_NAME: Cipher-Usability
  ENTRY_FILE: main.py
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Check Python file
        run: python -m py_compile "${{ env.ENTRY_FILE }}"

      - name: Build Windows executable
        run: python -m PyInstaller --onefile --name "${{ env.APP_NAME }}-Windows" "${{ env.ENTRY_FILE }}"

      - name: Upload executable to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "dist/${{ env.APP_NAME }}-Windows.exe" --clobber
